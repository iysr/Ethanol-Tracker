
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .screen { display: none; padding: 1rem 0; }
  .screen.active { display: block; }
  h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; }
  label { font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 1.25rem; }
  select, input[type=number] { width: 100%; }
  .btn { width: 100%; margin-top: 0.5rem; padding: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); transition: background 0.15s; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn-primary { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-sm { width: auto; padding: 6px 14px; font-size: 13px; margin-top: 0; }
  .btn-ghost { background: none; border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
  .btn-ghost:hover { background: var(--color-background-secondary); }
  .error { font-size: 13px; color: var(--color-text-danger); margin-bottom: 0.5rem; min-height: 18px; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
  .info-page-card { max-width: 360px; margin: 0 auto; }

  .switch-options { display: flex; align-items: center; gap: 8px; }
  .opt-label { font-size: 13px; color: var(--color-text-tertiary); transition: color 0.2s; }
  .opt-label.active { color: var(--color-text-primary); font-weight: 500; }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider {
    position: absolute; inset: 0;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 999px; cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .slider::before {
    content: ''; position: absolute;
    width: 18px; height: 18px; left: 2px; top: 2px;
    background: var(--color-text-secondary);
    border-radius: 50%; transition: transform 0.2s;
  }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .tracker-layout { display: flex; gap: 12px; align-items: flex-start; }
  .tracker-main { flex: 1; min-width: 0; }
  .bac-bar-outer { width: 28px; height: 320px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 999px; overflow: hidden; display: flex; align-items: flex-end; }
  .bac-fill { width: 100%; transition: height 0.6s, background 0.6s; border-radius: 999px; }
  .bac-label { font-size: 11px; font-weight: 500; color: var(--color-text-primary); }
  .bac-pct { font-size: 12px; color: var(--color-text-secondary); }
  .markers-col { position: relative; height: 320px; width: 44px; }
  .marker { position: absolute; left: 0; width: 8px; height: 0.5px; background: var(--color-border-secondary); }
  .marker-label { position: absolute; left: 12px; font-size: 9px; color: var(--color-text-tertiary); white-space: nowrap; transform: translateY(50%); }
  .zones-col { position: relative; height: 320px; width: 110px; }
  .zone-label { position: absolute; left: 0; font-size: 10px; padding: 2px 5px; border-radius: 4px; transform: translateY(50%); white-space: nowrap; font-weight: 500; }
  .timer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .timer-display { font-size: 15px; font-weight: 500; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
  .timer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-background-danger); display: none; flex-shrink: 0; }
  .timer-dot.running { display: block; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .drink-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .drink-item:last-child { border-bottom: none; }
  .drink-item span { color: var(--color-text-secondary); }
  .drink-item button { background: none; border: none; color: var(--color-text-danger); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .summary-row { display: flex; gap: 8px; margin-bottom: 0.75rem; }
  .metric { flex: 1; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 8px; text-align: center; }
  .metric-val { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .metric-lbl { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .status-badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--border-radius-md); margin-bottom: 0.5rem; }
  .profile-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 999px; padding: 3px 10px; margin-bottom: 0.75rem; cursor: pointer; }
  .profile-pill:hover { background: var(--color-background-primary); }
  .add-section.hidden { display: none; }
  .session-hint { font-size: 12px; color: var(--color-text-tertiary); text-align: center; padding: 12px 0 4px; }
  .restored-banner { font-size: 12px; color: var(--color-text-success); background: var(--color-background-success); border: 0.5px solid var(--color-border-success); border-radius: var(--border-radius-md); padding: 6px 10px; margin-bottom: 0.75rem; }
</style>

<div id="infoScreen" class="screen">
  <div class="info-page-card">
    <div class="card">
      <h2>Before we begin</h2>
      <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1.25rem;line-height:1.6;">Used to estimate BAC via the Widmark formula. For personal reference only — never a substitute for a breathalyzer.</p>
      <div class="field">
        <label style="margin-bottom:10px;">Biological sex</label>
        <div class="switch-options">
          <span class="opt-label active" id="genderLabelLeft">Male</span>
          <label class="switch"><input type="checkbox" id="genderSwitch" /><span class="slider"></span></label>
          <span class="opt-label" id="genderLabelRight">Female</span>
        </div>
      </div>
      <div class="field">
        <label style="margin-bottom:6px;">Body weight</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="number" id="weightInput" placeholder="70" min="30" max="300" style="flex:1;" />
          <div class="switch-options">
            <span class="opt-label active" id="wUnitLeft">kg</span>
            <label class="switch"><input type="checkbox" id="weightUnitSwitch" /><span class="slider"></span></label>
            <span class="opt-label" id="wUnitRight">lb</span>
          </div>
        </div>
      </div>
      <div class="field">
        <label style="margin-bottom:10px;">Volume units</label>
        <div class="switch-options">
          <span class="opt-label active" id="volUnitLeft">mL</span>
          <label class="switch"><input type="checkbox" id="volUnitSwitch" /><span class="slider"></span></label>
          <span class="opt-label" id="volUnitRight">fl oz</span>
        </div>
      </div>
      <div id="infoError" class="error"></div>
      <button class="btn btn-primary" id="startSetup">Start tracking</button>
    </div>
  </div>
</div>

<div id="trackerScreen" class="screen">
  <div class="tracker-layout">
    <div style="display:flex;gap:4px;align-items:flex-start;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div class="bac-label" id="bacVal">0.000%</div>
        <div style="display:flex;gap:2px;align-items:flex-start;">
          <div class="bac-bar-outer"><div class="bac-fill" id="bacFill" style="height:0%;background:#5DCAA5;"></div></div>
          <div class="markers-col" id="markersCol"></div>
        </div>
        <div class="bac-pct">BAC</div>
      </div>
      <div class="zones-col" id="zonesCol"></div>
    </div>
    <div class="tracker-main">
      <div id="profilePillWrap"></div>
      <div id="restoredBanner" style="display:none;" class="restored-banner">Session restored after page reload.</div>
      <div class="timer-row">
        <div class="timer-dot" id="timerDot"></div>
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <button class="btn btn-sm btn-primary" id="timerBtn">Start session</button>
        <button class="btn btn-sm btn-ghost" id="resetBtn" style="display:none;">End session</button>
      </div>
      <div class="summary-row">
        <div class="metric"><div class="metric-val" id="totalGrams">0.0g</div><div class="metric-lbl">alcohol</div></div>
        <div class="metric"><div class="metric-val" id="bacDisplay">0.000%</div><div class="metric-lbl">est. BAC</div></div>
        <div class="metric"><div class="metric-val" id="sobTimeDisplay">–</div><div class="metric-lbl">sober in</div></div>
      </div>
      <div id="sessionHint" class="session-hint">Start your session to begin logging drinks</div>
      <div id="addSection" class="add-section hidden">
        <div class="card" style="margin-bottom:0.75rem;">
          <div style="margin-bottom:8px;">
            <label>Drink type</label>
            <select id="drinkType">
              <option value="">Custom</option>
              <option value="White Wine" data-percent="12">White Wine (12%)</option>
              <option value="Champagne" data-percent="12">Champagne (12%)</option>
              <option value="Rosé Wine" data-percent="12.5">Rosé Wine (12.5%)</option>
              <option value="Red Wine" data-percent="13">Red Wine (13%)</option>
              <option value="Beer" data-percent="5">Beer (5%)</option>
              <option value="Light Beer" data-percent="3.5">Light Beer (3.5%)</option>
              <option value="Plum Wine" data-percent="14">Plum Wine (14%)</option>
              <option value="Soju" data-percent="20">Soju (20%)</option>
              <option value="Gin" data-percent="40">Gin (40%)</option>
              <option value="Vodka" data-percent="40">Vodka (40%)</option>
              <option value="Tequila" data-percent="38">Tequila (38%)</option>
              <option value="Whiskey" data-percent="40">Whiskey (40%)</option>
              <option value="Rum" data-percent="40">Rum (40%)</option>
              <option value="Martini" data-percent="32">Martini (32%)</option>
              <option value="Negroni" data-percent="24">Negroni (24%)</option>
              <option value="Long Island Iced Tea" data-percent="22">Long Island (22%)</option>
              <option value="Mojito" data-percent="13">Mojito (13%)</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <div style="flex:1;"><label id="volLabel">Volume (mL)</label><input type="number" id="volume" placeholder="330" min="0" /></div>
            <div style="flex:1;"><label>Alcohol %</label><input type="number" id="percent" placeholder="5" min="0" step="0.1" /></div>
          </div>
          <div id="addError" class="error"></div>
          <button class="btn btn-primary" id="addDrink">Add drink</button>
        </div>
      </div>
      <div id="statusBadgeWrap" style="margin-bottom:0.5rem;"></div>
      <div id="drinkList"></div>
    </div>
  </div>
</div>

<script>
  const PROFILE_COOKIE = 'bac_profile', SESSION_COOKIE = 'bac_session';
  const METABOLIZE_RATE = 0.015, MAX_BAC = 0.50;

  const BAC_ZONES = [
    { bac: 0.02, label: 'Feeling it',       color: '#C0DD97', text: '#3B6D11' },
    { bac: 0.05, label: 'Good time',        color: '#9FE1CB', text: '#085041' },
    { bac: 0.08, label: 'Illegal to drive', color: '#FAC775', text: '#854F0B' },
    { bac: 0.15, label: 'Slow down',        color: '#F0997B', text: '#993C1D' },
    { bac: 0.25, label: 'Almost lethal',    color: '#F7C1C1', text: '#A32D2D' },
    { bac: 0.40, label: 'Are you alive?',   color: '#F09595', text: '#791F1F' },
  ];

  let gender = 'male', weightKg = 70, volUnit = 'ml';
  let sessionStart = null, lastDrinkTime = null, timerInterval = null, drinks = [];

  function setCookie(n, v, ms) { document.cookie = n + '=' + encodeURIComponent(JSON.stringify(v)) + '; expires=' + new Date(Date.now() + ms).toUTCString() + '; path=/; SameSite=Lax'; }
  function deleteCookie(n) { document.cookie = n + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;'; }
  function getCookie(n) { const m = document.cookie.split('; ').find(r => r.startsWith(n + '=')); if (!m) return null; try { return JSON.parse(decodeURIComponent(m.split('=').slice(1).join('='))); } catch { return null; } }

  function saveProfile() { setCookie(PROFILE_COOKIE, { gender, weightKg, volUnit }, 365 * 864e5); }
  function loadProfile() { const p = getCookie(PROFILE_COOKIE); if (!p || !p.weightKg) return false; gender = p.gender || 'male'; weightKg = p.weightKg; volUnit = p.volUnit || 'ml'; return true; }
  function saveSession() { setCookie(SESSION_COOKIE, { sessionStartGMT: new Date(sessionStart).toUTCString(), drinks }, 12 * 3600000); }
  function clearSession() { deleteCookie(SESSION_COOKIE); }
  function loadSession() {
    const s = getCookie(SESSION_COOKIE); if (!s || !s.sessionStartGMT) return false;
    const parsed = new Date(s.sessionStartGMT).getTime(); if (isNaN(parsed)) return false;
    sessionStart = parsed; drinks = s.drinks || []; lastDrinkTime = drinks.length ? Date.now() : sessionStart; return true;
  }

  function pctH(bac) { return Math.min(bac / MAX_BAC, 1); }
  function widmarkR() { return gender === 'male' ? 0.68 : 0.55; }
  function getElapsedHours() { return sessionStart ? (Date.now() - sessionStart) / 3600000 : 0; }
  function calcBAC(eh) { return Math.max(0, drinks.reduce((sum, d) => sum + Math.max(0, (d.grams / (weightKg * 1000 * widmarkR())) * 100 - METABOLIZE_RATE * Math.max(0, eh - d.drinkEnd)), 0)); }

  function buildBacBar() {
    const mc = document.getElementById('markersCol'), zc = document.getElementById('zonesCol');
    mc.innerHTML = ''; zc.innerHTML = '';
    const H = 320;
    // markers at exactly the zone BAC thresholds
    BAC_ZONES.forEach(z => {
      const m = document.createElement('div');
      m.className = 'marker';
      m.style.cssText = `bottom:${pctH(z.bac) * H}px;position:absolute;`;
      mc.appendChild(m);
      const ml = document.createElement('div');
      ml.className = 'marker-label';
      ml.style.bottom = (pctH(z.bac) * H) + 'px';
      ml.textContent = z.bac.toFixed(2) + '%';
      mc.appendChild(ml);
    });
    BAC_ZONES.forEach(z => {
      const zl = document.createElement('div');
      zl.className = 'zone-label';
      zl.style.cssText = `bottom:${pctH(z.bac) * H}px;background:${z.color};color:${z.text};`;
      zl.textContent = z.label;
      zc.appendChild(zl);
    });
  }

  function updateBAC() {
    const bac = calcBAC(getElapsedHours());
    const fill = document.getElementById('bacFill');
    fill.style.height = (pctH(bac) * 320) + 'px';
    let color = '#5DCAA5';
    if (bac >= 0.40) color = '#E24B4A'; else if (bac >= 0.25) color = '#F0997B';
    else if (bac >= 0.15) color = '#EF9F27'; else if (bac >= 0.08) color = '#FAC775';
    else if (bac >= 0.05) color = '#9FE1CB';
    fill.style.background = color;
    const bacStr = bac.toFixed(3) + '%';
    document.getElementById('bacVal').textContent = bacStr;
    document.getElementById('bacDisplay').textContent = bacStr;
    let sl = '', sb = '', st = '';
    if (bac >= 0.40) { sl = 'Are you alive?'; sb = '#FCEBEB'; st = '#A32D2D'; }
    else if (bac >= 0.25) { sl = 'Almost lethal — stop now'; sb = '#FAECE7'; st = '#993C1D'; }
    else if (bac >= 0.15) { sl = 'Slow down'; sb = '#FAEEDA'; st = '#854F0B'; }
    else if (bac >= 0.08) { sl = 'Illegal to drive'; sb = '#FAEEDA'; st = '#633806'; }
    else if (bac >= 0.05) { sl = 'Good time'; sb = '#E1F5EE'; st = '#085041'; }
    else if (bac >= 0.02) { sl = 'Feeling it'; sb = '#EAF3DE'; st = '#27500A'; }
    document.getElementById('statusBadgeWrap').innerHTML = sl ? `<span class="status-badge" style="background:${sb};color:${st};">${sl}</span>` : '';
    const soberH = bac / METABOLIZE_RATE;
    const sob = document.getElementById('sobTimeDisplay');
    if (bac < 0.005) sob.textContent = 'Sober';
    else { const h = Math.floor(soberH), mn = Math.round((soberH - h) * 60); sob.textContent = h > 0 ? `${h}h ${mn}m` : `${mn}m`; }
  }

  function updateTimer() {
    if (!sessionStart) return;
    const e = Date.now() - sessionStart;
    const h = Math.floor(e / 3600000), m = Math.floor((e % 3600000) / 60000), s = Math.floor((e % 60000) / 1000);
    document.getElementById('timerDisplay').textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    updateBAC();
  }

  function renderDrinks() {
    const list = document.getElementById('drinkList');
    list.innerHTML = drinks.map((d, i) => `
      <div class="drink-item">
        <div><span style="color:var(--color-text-primary);font-weight:500;">${d.name}</span><span> – ${d.vol} ${volUnit === 'ml' ? 'mL' : 'fl oz'} @ ${d.pct}%</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><span>${d.grams.toFixed(1)}g</span><button onclick="removeDrink(${i})">✕</button></div>
      </div>`).join('');
    document.getElementById('totalGrams').textContent = drinks.reduce((s, d) => s + d.grams, 0).toFixed(1) + 'g';
  }
  window.removeDrink = (i) => { drinks.splice(i, 1); saveSession(); renderDrinks(); updateBAC(); };

  function syncLabels(leftId, rightId, checked) {
    document.getElementById(leftId).classList.toggle('active', !checked);
    document.getElementById(rightId).classList.toggle('active', checked);
  }

  document.getElementById('genderSwitch').addEventListener('change', function () { gender = this.checked ? 'female' : 'male'; syncLabels('genderLabelLeft', 'genderLabelRight', this.checked); });
  document.getElementById('weightUnitSwitch').addEventListener('change', function () {
    const w = parseFloat(document.getElementById('weightInput').value);
    if (!isNaN(w)) document.getElementById('weightInput').value = this.checked ? Math.round(w * 2.2046) : Math.round(w * 0.4536);
    syncLabels('wUnitLeft', 'wUnitRight', this.checked);
  });
  document.getElementById('volUnitSwitch').addEventListener('change', function () { volUnit = this.checked ? 'floz' : 'ml'; syncLabels('volUnitLeft', 'volUnitRight', this.checked); });

  function applySavedToSwitches() {
    const gs = document.getElementById('genderSwitch'); gs.checked = gender === 'female'; syncLabels('genderLabelLeft', 'genderLabelRight', gs.checked);
    const vs = document.getElementById('volUnitSwitch'); vs.checked = volUnit === 'floz'; syncLabels('volUnitLeft', 'volUnitRight', vs.checked);
    document.getElementById('weightInput').value = Math.round(weightKg);
  }

  function showProfilePill() {
    const w = weightKg % 1 === 0 ? weightKg : weightKg.toFixed(1);
    document.getElementById('profilePillWrap').innerHTML = `<div class="profile-pill" id="editProfileBtn">${gender === 'male' ? 'Male' : 'Female'} &middot; ${w} kg &middot; ${volUnit === 'ml' ? 'mL' : 'fl oz'}<span style="font-size:11px;opacity:0.6;">edit</span></div>`;
    document.getElementById('editProfileBtn').onclick = () => { document.getElementById('trackerScreen').classList.remove('active'); document.getElementById('infoScreen').classList.add('active'); applySavedToSwitches(); };
  }

  function startSessionUI(restored) {
    document.getElementById('timerBtn').style.display = 'none';
    document.getElementById('resetBtn').style.display = '';
    document.getElementById('timerDot').classList.add('running');
    document.getElementById('sessionHint').style.display = 'none';
    document.getElementById('addSection').classList.remove('hidden');
    if (restored) document.getElementById('restoredBanner').style.display = '';
    timerInterval = setInterval(updateTimer, 1000);
    renderDrinks(); updateBAC();
  }

  function launchTracker(restored) {
    document.getElementById('infoScreen').classList.remove('active');
    document.getElementById('trackerScreen').classList.add('active');
    document.getElementById('volLabel').textContent = 'Volume (' + (volUnit === 'ml' ? 'mL' : 'fl oz') + ')';
    buildBacBar(); showProfilePill();
    if (sessionStart) startSessionUI(restored); else updateBAC();
  }

  document.getElementById('startSetup').onclick = () => {
    const wRaw = parseFloat(document.getElementById('weightInput').value);
    const isLb = document.getElementById('weightUnitSwitch').checked;
    if (isNaN(wRaw) || wRaw < 30) { document.getElementById('infoError').textContent = 'Please enter a valid weight.'; return; }
    gender = document.getElementById('genderSwitch').checked ? 'female' : 'male';
    volUnit = document.getElementById('volUnitSwitch').checked ? 'floz' : 'ml';
    weightKg = isLb ? wRaw * 0.4536 : wRaw;
    saveProfile(); launchTracker(false);
  };

  document.getElementById('timerBtn').onclick = () => {
    sessionStart = Date.now(); lastDrinkTime = sessionStart;
    saveSession(); startSessionUI(false);
  };

  document.getElementById('resetBtn').onclick = () => {
    clearInterval(timerInterval); clearSession();
    sessionStart = null; lastDrinkTime = null; drinks = [];
    document.getElementById('timerBtn').style.display = '';
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('timerDisplay').textContent = '00:00:00';
    document.getElementById('timerDot').classList.remove('running');
    document.getElementById('sessionHint').style.display = '';
    document.getElementById('sessionHint').textContent = 'Start your session to begin logging drinks';
    document.getElementById('addSection').classList.add('hidden');
    document.getElementById('restoredBanner').style.display = 'none';
    renderDrinks(); updateBAC();
    document.getElementById('totalGrams').textContent = '0.0g';
  };

  document.getElementById('drinkType').addEventListener('change', function () { const o = this.options[this.selectedIndex]; if (o.dataset.percent) document.getElementById('percent').value = o.dataset.percent; });

  document.getElementById('addDrink').onclick = () => {
    const errEl = document.getElementById('addError'); errEl.textContent = '';
    const vol = parseFloat(document.getElementById('volume').value), pct = parseFloat(document.getElementById('percent').value);
    const name = document.getElementById('drinkType').value || 'Custom drink';
    if (isNaN(vol) || isNaN(pct)) { errEl.textContent = 'Please enter volume and alcohol %.'; return; }
    if (pct > 100) { errEl.textContent = 'Alcohol % cannot exceed 100.'; return; }
    if (vol > 5000) { errEl.textContent = 'That seems like a lot — double check volume.'; return; }
    const volML = volUnit === 'ml' ? vol : vol * 29.5735;
    const grams = volML * (pct / 100) * 0.789;
    lastDrinkTime = Date.now();
    drinks.push({ name, vol, pct, grams, drinkEnd: getElapsedHours() });
    saveSession(); renderDrinks(); updateBAC();
    document.getElementById('volume').value = ''; document.getElementById('percent').value = ''; document.getElementById('drinkType').selectedIndex = 0;
  };

  (function init() {
    const hasProfile = loadProfile();
    if (!hasProfile) { document.getElementById('infoScreen').classList.add('active'); return; }
    applySavedToSwitches();
    const hasSession = loadSession();
    launchTracker(hasSession);
  })();
</script>
