<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alcohol Tracker</title>
<style>
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: radial-gradient(circle at top left, #1a1c2b, #0c0e17);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 2rem;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  h1 {
    margin-bottom: 1rem;
    font-size: 1.6rem;
  }

  .toggle-group {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    margin-bottom: 1rem;
    padding: 0.25rem;
  }

  .toggle-group span {
    flex: 1;
    text-align: center;
    padding: 0.4rem 0;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .toggle-group span.active {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #000;
    font-weight: 600;
  }

  select, input {
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 999px;
    padding: 0.6rem;
    color: #fff;
    font-size: 1rem;
    margin-bottom: 0.6rem;
    text-align: center;
  }

  select {
    width: 100%;
  }

  input {
    width: calc(100% - 1.2rem);
  }

  select option {
    background: #1a1c2b;
    color: #fff;
  }

  button.add {
    width: 100%;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border: none;
    color: #000;
    font-weight: 600;
    border-radius: 999px;
    padding: 0.7rem;
    margin-top: 0.4rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button.add:hover {
    opacity: 0.85;
  }

  .error {
    color: #ff7575;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }

  .summary {
    margin-top: 1rem;
    font-weight: 500;
  }

  .progress-container {
    margin-top: 0.5rem;
    width: 100%;
    background: rgba(255,255,255,0.1);
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 0.4s, background 0.4s;
  }

  .warning {
    margin-top: 0.5rem;
    font-weight: 600;
  }

  .drink-list {
    margin-top: 1rem;
  }

  .drink-item {
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    margin-top: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }

  .drink-item button {
    background: none;
    border: none;
    color: #ff7575;
    cursor: pointer;
    font-size: 1rem;
  }

  .drink-item button:hover {
    color: #ff4d4d;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>C2H5OH Tracker</h1>

    <div class="toggle-group" id="genderToggle">
      <span class="active" data-gender="male">Male</span>
      <span data-gender="female">Female</span>
    </div>

    <div class="toggle-group" id="unitToggle">
      <span class="active" data-unit="ml">mL</span>
      <span data-unit="floz">fl oz</span>
    </div>

    <div id="error" class="error"></div>

    <select id="drinkType">
      <option value="">Select Drink Type (optional)</option>
      <option value="White Wine" data-percent="12">White Wine (12%)</option>
      <option value="Champagne" data-percent="12">Champagne (12%)</option>
      <option value="Rose Wine" data-percent="12.5">Rosé Wine (12.5%)</option>
      <option value="Red Wine" data-percent="13">Red Wine (13%)</option>
      <option value="Beer" data-percent="5">Beer (5%)</option>
      <option value="Light Beer" data-percent="3.5">Light Beer (3.5%)</option>
      <option value="Plum Wine" data-percent="14">Plum Wine (14%)</option>
      <option value="Soju" data-percent="20">Soju (20%)</option>
      <option value="Gin" data-percent="40">Gin (40%)</option>
      <option value="Vodka" data-percent="40">Vodka (40%)</option>
      <option value="Tequila" data-percent="38">Tequila (38%)</option>
      <option value="Whiskey" data-percent="40">Whiskey (40%)</option>
      <option value="Rum" data-percent="40">Rum (40%)</option>
      <option value="Martini" data-percent="32">Martini (32%)</option>
      <option value="Negroni" data-percent="24">Negroni (24%)</option>
      <option value="Long Island Iced Tea" data-percent="22">Long Island Iced Tea (22%)</option>
      <option value="Mojito" data-percent="13">Mojito (13%)</option>
    </select>

    <input type="number" id="volume" placeholder="Volume (mL)" min="0" />
    <input type="number" id="percent" placeholder="Alcohol % (w/v)" min="0" step="0.1" />

    <button class="add" id="addDrink">Add Drink</button>

    <div class="summary" id="summary">Total alcohol: 0 g</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="percentLimit" style="margin-top:0.3rem; font-size:0.9rem;"></div>
    <div class="warning" id="warning"></div>

    <div class="drink-list" id="drinkList"></div>
  </div>

<script>
  const genderToggle = document.getElementById("genderToggle");
  const unitToggle = document.getElementById("unitToggle");
  const drinkType = document.getElementById("drinkType");
  const volumeInput = document.getElementById("volume");
  const percentInput = document.getElementById("percent");
  const addDrinkBtn = document.getElementById("addDrink");
  const errorMsg = document.getElementById("error");
  const summary = document.getElementById("summary");
  const progressBar = document.getElementById("progressBar");
  const percentLimit = document.getElementById("percentLimit");
  const warning = document.getElementById("warning");
  const drinkList = document.getElementById("drinkList");

  let gender = "male";
  let unit = "ml";
  let totalAlcohol = 0;
  let drinks = [];

  genderToggle.addEventListener("click", (e) => {
    if (e.target.dataset.gender) {
      [...genderToggle.children].forEach(ch => ch.classList.remove("active"));
      e.target.classList.add("active");
      gender = e.target.dataset.gender;
      updateSummary();
    }
  });

  unitToggle.addEventListener("click", (e) => {
    if (e.target.dataset.unit) {
      [...unitToggle.children].forEach(ch => ch.classList.remove("active"));
      e.target.classList.add("active");
      unit = e.target.dataset.unit;
      volumeInput.placeholder = `Volume (${unit === "ml" ? "mL" : "fl oz"})`;
    }
  });

  drinkType.addEventListener("change", () => {
    const selected = drinkType.options[drinkType.selectedIndex];
    const percent = selected.dataset.percent;
    percentInput.value = percent || "";
  });

  addDrinkBtn.onclick = () => {
    errorMsg.textContent = "";
    const volume = parseFloat(volumeInput.value);
    const percent = parseFloat(percentInput.value);
    const name = drinkType.value || "Custom Drink";

    if (isNaN(volume) || isNaN(percent)) {
      errorMsg.textContent = "Please enter valid values.";
      return;
    }
    if (percent > 100) {
      errorMsg.textContent = "Percentages stop at 100, you might already be drunk.";
      return;
    }
    if (volume > 5000) {
      errorMsg.textContent = "Perhaps you didn't actually drink that much. Try again.";
      return;
    }

    let volML = volume;
    if (unit === "floz") volML = volume * 29.5735;

    const grams = volML * (percent / 100) * 0.789;
    totalAlcohol += grams;

    drinks.push({ name, volume: volume, unit, percent, grams });
    updateSummary();
    updateList();
    volumeInput.value = "";
    percentInput.value = "";
    drinkType.selectedIndex = 0;
  };

  function updateSummary() {
    summary.textContent = `Total alcohol: ${totalAlcohol.toFixed(1)} g`;
    const limit = gender === "male" ? 28 : 14;
    const heavy = gender === "male" ? 70 : 56;
    const percentage = Math.min((totalAlcohol / limit) * 100);
    percentLimit.textContent = `${Math.round(percentage)}% of limit`;

    if (totalAlcohol < limit) {
      progressBar.style.background = "linear-gradient(90deg, #4facfe, #00f2fe)";
    } else if (totalAlcohol < heavy) {
      progressBar.style.background = "linear-gradient(90deg, #facc15, #f97316)";
    } else {
      progressBar.style.background = "linear-gradient(90deg, #ef4444, #b91c1c)";
    }

    progressBar.style.width = `${Math.min((totalAlcohol / heavy) * 100, 100)}%`;

    if (totalAlcohol >= heavy) {
      warning.textContent = "⚠️ Heavy drinking range reached. Please stop.";
      warning.style.color = "#ef4444";
    } else if (totalAlcohol >= limit) {
      warning.textContent = "❗ You have exceeded the recommended limit.";
      warning.style.color = "#facc15";
    } else {
      warning.textContent = "";
    }
  }

  function updateList() {
    drinkList.innerHTML = "";
    drinks.forEach((d, i) => {
      const item = document.createElement("div");
      item.className = "drink-item";
      item.innerHTML = `
        <span>${d.name} – ${d.volume} ${d.unit === "ml" ? "mL" : "fl oz"} @ ${d.percent}% → ${d.grams.toFixed(1)} g</span>
        <button onclick="removeDrink(${i})">✕</button>
      `;
      drinkList.appendChild(item);
    });
  }

  window.removeDrink = (i) => {
    totalAlcohol -= drinks[i].grams;
    drinks.splice(i, 1);
    updateList();
    updateSummary();
  };
</script>
</body>
</html>
